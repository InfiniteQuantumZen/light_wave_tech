<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shader Timeline Editor</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --card-bg: #2a2a3f;
            --text-color: #cdd6f4;
            --accent: #89b4fa;
            --border: #45475a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 20px 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        button, input[type="file"]::file-selector-button {
            background-color: var(--accent);
            color: #11111b;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover, input[type="file"]::file-selector-button:hover {
            opacity: 0.8;
        }
        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .timeline-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            position: relative;
        }
        .timeline-item h3 {
            grid-column: 1 / -1;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .timeline-item h3 span {
            color: var(--accent);
            font-family: monospace;
            font-size: 1.2em;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85em;
            margin-bottom: 4px;
            color: #a6adc8;
        }
        input[type="text"], input[type="number"] {
            background-color: #181825;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        input:focus {
            outline: 2px solid var(--accent);
        }
        .actions {
            grid-column: 1 / -1;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .recalibrate-btn {
            background-color: #a6e3a1;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>Shader Timeline Editor</h2>
            <input type="file" id="fileInput" accept=".json">
        </div>
        <div>
            <span id="currentFileStatus" style="margin-right: 15px; font-family: monospace;">No file loaded</span>
            <button id="exportBtn" style="display: none;">Export Versioned JSON</button>
        </div>
    </div>

    <div id="timelineContainer" class="timeline-container">
        <!-- Timeline items will be injected here by JavaScript -->
    </div>

    <script>
        // Application State
        let timelineData = [];
        let originalFilename = "timeline.json";
        let exportVersion = 1;

        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const currentFileStatus = document.getElementById('currentFileStatus');
        const timelineContainer = document.getElementById('timelineContainer');
        const exportBtn = document.getElementById('exportBtn');

        // 1. Read the JSON file (Modern HTML5 File API)
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            originalFilename = file.name;
            currentFileStatus.innerText = `Editing: ${originalFilename}`;
            exportVersion = 1; // Reset version counter on new file

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    timelineData = parsed.timeline || [];
                    renderTimeline();
                    exportBtn.style.display = 'inline-block';
                } catch (error) {
                    alert("Error parsing JSON. Please ensure it's a valid JSON file.");
                }
            };
            reader.readAsText(file);
        });

        // 2. Render the items dynamically
        function renderTimeline() {
            timelineContainer.innerHTML = ''; // Clear container

            timelineData.forEach((item, index) => {
                // Create a container for the item
                const div = document.createElement('div');
                div.className = 'timeline-item';

                // Helper function to create inputs safely
                const createInput = (label, key, type = "text") => `
                    <div class="form-group">
                        <label>${label}</label>
                        <input type="${type}" 
                               ${type === 'number' ? 'step="0.1"' : ''} 
                               value="${item[key] !== null ? item[key] : ''}" 
                               onchange="updateData(${index}, '${key}', this.value, '${type}')"
                               placeholder="null">
                    </div>
                `;

                div.innerHTML = `
                    <h3><span>#${index}</span> <input type="text" style="flex-grow: 1; font-weight: bold; font-size: 1em;" value="${item.name}" onchange="updateData(${index}, 'name', this.value, 'text')"></h3>
                    
                    ${createInput("Start Time (sec)", "effect_start_time", "number")}
                    ${createInput("Duration (sec)", "effect_duration", "number")}
                    
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Shader Effect File</label>
                        <input type="text" value="${item.shader_effect_file}" onchange="updateData(${index}, 'shader_effect_file', this.value, 'text')">
                    </div>

                    ${createInput("Material 1", "material_1")}
                    ${createInput("Material 2", "material_2")}
                    ${createInput("Material 3", "material_3")}
                    ${createInput("Material 4", "material_4")}

                    <div class="actions">
                        <span style="color: #6c7086; font-size: 0.9em;">Any changes auto-save to memory.</span>
                        <button class="recalibrate-btn" onclick="recalibrateFrom(${index})">Recalibrate Time From Here ➔</button>
                    </div>
                `;
                timelineContainer.appendChild(div);
            });
        }

        // 3. Update data when a user types something
        window.updateData = function(index, key, value, type) {
            // Handle empty strings as null for text fields
            if (type === 'text' && value.trim() === '') {
                timelineData[index][key] = null;
            } else if (type === 'number') {
                timelineData[index][key] = parseFloat(value) || 0;
            } else {
                timelineData[index][key] = value;
            }
        };

        // 4. The core logic: Recalibrate timeline math!
        window.recalibrateFrom = function(startIndex) {
            // Loop through all items AFTER the one we clicked
            for (let i = startIndex + 1; i < timelineData.length; i++) {
                let previousItem = timelineData[i - 1];
                let currentItem = timelineData[i];
                
                // New start time is Previous Start + Previous Duration
                let calculatedStart = previousItem.effect_start_time + previousItem.effect_duration;
                
                // Math.round is used to prevent weird JavaScript float math like 0.1+0.2 = 0.300000000004
                currentItem.effect_start_time = Math.round(calculatedStart * 1000) / 1000;
            }
            
            // Re-render the screen to show updated numbers
            renderTimeline();
        };

        // 5. Export / Download functionality (Modern Blob API)
        exportBtn.addEventListener('click', () => {
            // Format version number like 001, 002, etc.
            const versionString = String(exportVersion).padStart(3, '0');
            
            // Remove the old .json extension and add our version marker
            const baseName = originalFilename.replace(/\.json$/i, '');
            const newFilename = `${baseName}_${versionString}.json`;

            // Prepare the JSON text
            const finalData = { timeline: timelineData };
            const jsonText = JSON.stringify(finalData, null, 2);

            // Create a "Blob" (a file-like object in memory)
            const blob = new Blob([jsonText], { type: 'application/json' });
            
            // Create a temporary hidden link to trigger the download
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = newFilename;
            
            // "Click" it automatically to save the file
            document.body.appendChild(a);
            a.click();
            
            // Clean up
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Increment version for next click
            exportVersion++;
            currentFileStatus.innerText = `Last exported: ${newFilename}`;
        });
    </script>
</body>
</html>
